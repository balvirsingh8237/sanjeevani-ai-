<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Auth - Sanjeevani</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Work Sans', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
  
  /* पासवर्ड स्क्रीन का डिज़ाइन */
  #auth-screen { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
  #auth-screen h2 { color: #1B4332; margin-bottom: 20px; }
  .input-field { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1rem; }
  .btn { padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; font-size: 1rem; background: #1B4332; width: 100%; }
  .error-msg { color: red; font-weight: bold; margin-top: 15px; display: none; }

  /* एडमिन पैनल का डिज़ाइन (जो छुपकर रहेगा) */
  #admin-panel { display: none; }
  .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
  th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
  th { background-color: #1B4332; color: white; }
  .urgent { color: #B5473E; font-weight: bold; }
  .normal { color: #DA9A3D; font-weight: bold; }
  .low { color: #40916C; font-weight: bold; }
</style>
</head>
<body>

<!-- पासवर्ड मांगने वाली स्क्रीन -->
<div id="auth-screen">
  <h2>Admin Access</h2>
  <p>कृपया एडमिन पासवर्ड डालें</p>
  <input type="password" id="pass-input" class="input-field" placeholder="Enter Password">
  <button id="unlock-btn" class="btn">Unlock Panel</button>
  <p id="error-msg" class="error-msg">⚠️ गलत पासवर्ड!</p>
</div>

<!-- असली एडमिन पैनल (शुरू में छुपा रहेगा) -->
<div id="admin-panel">
  <div class="header">
    <h1 style="color: #1B4332; margin: 0;">संजीवनी AI - Admin Dashboard</h1>
    <button onclick="location.reload()" style="padding: 8px 15px; background: #d93025; color: white; border: none; border-radius: 5px; cursor: pointer;">Lock & Exit</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>नाम</th>
        <th>उम्र</th>
        <th>नंबर</th>
        <th>पता</th>
        <th>समस्या</th>
        <th>गंभीरता</th>
        <th>समय</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <!-- डेटा यहाँ लोड होगा -->
    </tbody>
  </table>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAgYfbCOPHqQz4ML3q-9KRtBZ5FItnGdeo",
    authDomain: "sanjeevani-ai-52213.firebaseapp.com",
    projectId: "sanjeevani-ai-52213",
    storageBucket: "sanjeevani-ai-52213.firebasestorage.app",
    messagingSenderId: "1009486245779",
    appId: "1:1009486245779:web:4c83bb570237c1f2ddc266"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const authScreen = document.getElementById('auth-screen');
  const adminPanel = document.getElementById('admin-panel');
  const passInput = document.getElementById('pass-input');
  const unlockBtn = document.getElementById('unlock-btn');
  const errorMsg = document.getElementById('error-msg');
  const tableBody = document.getElementById('table-body');

  // पासवर्ड चेक करने का लॉजिक
  unlockBtn.addEventListener('click', () => {
    if (passInput.value === 'Balvir@420') {
      authScreen.style.display = 'none';
      adminPanel.style.display = 'block';
      loadData(); // सही पासवर्ड पर ही फायरबेस से डेटा मंगाएंगे
    } else {
      errorMsg.style.display = 'block';
    }
  });

  async function loadData() {
    tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">डेटा लोड हो रहा है...</td></tr>';
    try {
      const q = query(collection(db, "reports"), orderBy("timestamp", "desc"));
      const querySnapshot = await getDocs(q);
      tableBody.innerHTML = '';
      
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const date = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString() : "N/A";
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${data.patientName}</td>
          <td>${data.age}</td>
          <td>${data.mobile}</td>
          <td>${data.village}</td>
          <td>${data.problem}</td>
          <td class="${data.severity}">${data.severity.toUpperCase()}</td>
          <td>${date}</td>
        `;
        tableBody.appendChild(tr);
      });
    } catch (error) {
      tableBody.innerHTML = '<tr><td colspan="7" style="color:red; text-align:center;">डेटा लोड करने में समस्या आई।</td></tr>';
    }
  }
</script>
</body>
</html>
