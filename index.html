<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanjeevani AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --green-deep:#1B4332; --green-mid:#40916C; --green-pale:#D8F3DC; --white:#FFFFFF; --ink:#16241D; --border:#CFE3D6; --radius-card: 14px; --max-w: 1180px; }
  body{ margin:0; background:var(--white); color:var(--ink); font-family:'Work Sans', sans-serif; line-height:1.55; }
  h1,h2,h3{font-family:'Fraunces', serif; margin:0; color:var(--green-deep);}
  
  header{ display:flex; align-items:center; justify-content:space-between; padding:18px 6%; border-bottom:1px solid var(--border); }
  .brand{font-family:'Fraunces', serif; font-weight:600; font-size:1.5rem; color:var(--green-deep);}
  .hero{ text-align:center; padding:40px 6%; }
  
  /* नया AI सेक्शन डिज़ाइन */
  .ai-section { background: linear-gradient(135deg, #D8F3DC, #e8f7ea); border-radius: var(--radius-card); padding: 30px; max-width: 800px; margin: 0 auto 40px auto; border: 2px solid var(--green-mid); box-shadow: 0 8px 20px rgba(64, 145, 108, 0.15); }
  .ai-section h2 { margin-bottom: 15px; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .ai-chat-box { background: white; height: 250px; border-radius: 10px; overflow-y: auto; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  .ai-input-area { display: flex; gap: 10px; }
  .ai-input-area input { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
  .ai-input-area button { background: var(--green-deep); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  
  /* फॉर्म डिज़ाइन */
  .form-card{ background:var(--white); border-radius:var(--radius-card); padding:32px; border:1px solid var(--border); max-width: 800px; margin: 0 auto 40px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
  .field{margin-bottom:18px;}
  .field label{display:block; font-weight:500; margin-bottom:6px;}
  .field input, .field textarea, .field select{ width:100%; padding:11px 13px; border-radius:8px; border:1px solid var(--border); font-family:inherit; box-sizing: border-box; }
  .submit-btn{ width:100%; padding:14px; border:none; border-radius:8px; background:var(--green-deep); color:var(--white); font-weight:600; font-size:1rem; cursor:pointer; }
</style>
</head>
<body>

<header>
  <div class="brand">Sanjeevani AI</div>
</header>

<section class="hero">
  <h1>हर गाँव तक मदद, समय पर</h1>
  <p>AI से अपनी बीमारी का इलाज पूछें, या गंभीर स्थिति में नीचे फॉर्म भरकर डॉक्टर को बुलाएं।</p>
</section>

<!-- नया AI सेक्शन -->
<section class="ai-section">
  <h2>🤖 संजीवनी AI डॉक्टर</h2>
  <p style="text-align:center; margin-top:-10px; margin-bottom:20px;">अपनी बीमारी या लक्षण बताएँ, AI आपको तुरंत सलाह देगा।</p>
  
  <div class="ai-chat-box" id="ai-chat-box">
    <div style="background:var(--green-pale); padding:10px 15px; border-radius:10px; max-width:80%; align-self:flex-start;">
      नमस्ते! मैं संजीवनी AI हूँ। आपको क्या परेशानी है?
    </div>
  </div>
  
  <div class="ai-input-area">
    <input type="text" id="ai-input" placeholder="जैसे: मुझे दो दिन से तेज़ बुखार है...">
    <button id="ai-send-btn">पूछें</button>
  </div>
</section>

<!-- फॉर्म सेक्शन -->
<section class="form-card">
  <h2>📝 डॉक्टर को बुलाने के लिए फॉर्म भरें</h2>
  <form id="problem-form">
    <div class="field">
      <label>नाम</label>
      <input type="text" id="name" required placeholder="पूरा नाम">
    </div>
    <div class="field">
      <label>उम्र</label>
      <input type="number" id="age" required placeholder="उम्र">
    </div>
    <div class="field">
      <label>मोबाइल नंबर</label>
      <input type="tel" id="mobile" required placeholder="10 अंकों का नंबर">
    </div>
    <div class="field">
      <label>गाँव / पता</label>
      <input type="text" id="village" required placeholder="गाँव, ब्लॉक, जिला">
    </div>
    <div class="field">
      <label>समस्या का विवरण</label>
      <textarea id="problem" rows="3" required placeholder="बीमारी या समस्या बताएं"></textarea>
    </div>
    <div class="field">
      <label>समस्या कितनी गंभीर है?</label>
      <select id="severity" required>
        <option value="urgent">तुरंत (6 से 24 घंटे)</option>
        <option value="normal" selected>सामान्य (3 से 5 दिन)</option>
        <option value="low">कम गंभीर (1 से 2 हफ्ते)</option>
      </select>
    </div>
    <button type="submit" id="submit-btn" class="submit-btn">शिकायत दर्ज करें (Submit)</button>
  </form>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  // Firebase Setup
  const firebaseConfig = {
    apiKey: "AIzaSyAgYfbCOPHqQz4ML3q-9KRtBZ5FItnGdeo",
    authDomain: "sanjeevani-ai-52213.firebaseapp.com",
    projectId: "sanjeevani-ai-52213",
    storageBucket: "sanjeevani-ai-52213.firebasestorage.app",
    messagingSenderId: "1009486245779",
    appId: "1:1009486245779:web:4c83bb570237c1f2ddc266"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Form Submit Logic
  const submitBtn = document.getElementById('submit-btn');
  document.getElementById('problem-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.innerText = "Submitting...";

    try {
      await addDoc(collection(db, "reports"), {
        patientName: document.getElementById('name').value,
        age: document.getElementById('age').value,
        mobile: document.getElementById('mobile').value,
        village: document.getElementById('village').value,
        problem: document.getElementById('problem').value,
        severity: document.getElementById('severity').value,
        timestamp: serverTimestamp()
      });
      alert("शिकायत सफलतापूर्वक दर्ज हो गई है! टीम जल्द संपर्क करेगी।");
      e.target.reset();
    } catch (error) {
      alert("Error: " + error.message);
    } finally {
      submitBtn.innerText = "शिकायत दर्ज करें (Submit)";
    }
  });

  // AI Chat Logic (Connects to Vercel API we made earlier)
  const aiSendBtn = document.getElementById('ai-send-btn');
  const aiInput = document.getElementById('ai-input');
  const aiChatBox = document.getElementById('ai-chat-box');

  function addMsg(text, isUser) {
    const div = document.createElement('div');
    div.style.padding = '10px 15px';
    div.style.borderRadius = '10px';
    div.style.maxWidth = '80%';
    div.style.background = isUser ? 'var(--green-deep)' : 'var(--green-pale)';
    div.style.color = isUser ? 'white' : 'black';
    div.style.alignSelf = isUser ? 'flex-end' : 'flex-start';
    div.innerText = text;
    aiChatBox.appendChild(div);
    aiChatBox.scrollTop = aiChatBox.scrollHeight;
  }

  aiSendBtn.addEventListener('click', async () => {
    const text = aiInput.value.trim();
    if (!text) return;
    addMsg(text, true);
    aiInput.value = '';

    const loadingId = 'load-' + Date.now();
    const loadingDiv = document.createElement('div');
    loadingDiv.id = loadingId;
    loadingDiv.innerText = "संजीवनी AI सोच रहा है...";
    loadingDiv.style.alignSelf = "flex-start";
    loadingDiv.style.fontSize = "0.85rem";
    aiChatBox.appendChild(loadingDiv);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      document.getElementById(loadingId).remove();
      addMsg(data.reply || "मुझे समझ नहीं आया।", false);
    } catch (err) {
      document.getElementById(loadingId).remove();
      addMsg("सर्वर से संपर्क टूट गया है।", false);
    }
  });
</script>
</body>
</html>
